<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VivaGym Sevilla · Google Reviews</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}header{background:#111;color:#fff;padding:28px}main{max-width:1050px;margin:24px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,section{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001}.v{font-size:28px;font-weight:700}section{margin-top:18px;padding:0;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:14px;border-bottom:1px solid #eee;text-align:left}th{font-size:11px;color:#777}a{color:inherit}@media(max-width:700px){.cards{grid-template-columns:2fr 2fr}}</style><header><small>VIVAGYM · SEVILLA</small><h1>Google Reviews</h1><span>Seguimiento de puntuación y reseñas</span></header><main><div class="cards"><div class="card">CLUBES<div class="v" id="clubs">6</div></div><div class="card">RESEÑAS<div class="v" id="total">—</div></div><div class="card">MEDIA<div class="v" id="avg">—</div></div><div class="card">ACTUALIZADO<div class="v" id="date" style="font-size:16px">—</div></div></div><section><table><thead><tr><th>CLUB</th><th>⭐</th><th>RESEÑAS</th><th>Δ</th><th>GOOGLE</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>fetch("./data/reviews.json?"+Date.now()).then(r=>r.json()).then(j=>{let d=j.data;document.getElementById("total").textContent=d.reduce((a,x)=>a+x.reviews,0).toLocaleString("es-ES");document.getElementById("avg").textContent=(d.reduce((a,x)=>a+x.rating,0)/d.length).toFixed(2)+" ⭐";document.getElementById("date").textContent=j.updated?new Date(j.updated).toLocaleString("es-ES"):"—";document.getElementById("rows").innerHTML=d.map(x=>"<tr><td><b>"+x.name+"</b></td><td>⭐ "+x.rating.toFixed(1)+"</td><td>"+x.reviews.toLocaleString("es-ES")+"</td><td>"+(x.delta_reviews==null?"—":(x.delta_reviews>0?"+":"")+x.delta_reviews)+"</td><td><a target=_blank href=""+x.url+"">Abrir</a></td></tr>").join("")}).catch(()=>document.getElementById("rows").innerHTML="<tr><td colspan=5>No se pudo cargar data/reviews.json</td></tr>");</script></html>
