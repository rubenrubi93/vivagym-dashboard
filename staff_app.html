<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VivaGym Staff · Incidencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#fd5000;--bg:#0f172a;--surface:#1e293b;--surface2:#162032;
    --border:rgba(255,255,255,.08);--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
    --ok:#16a34a;--warn:#f59e0b;--ko:#dc2626;--radius:10px;
    --font:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}

  /* LOGIN */
  #loginOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#0b1628 0%,#1a2744 100%);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
  .login-box{background:rgba(30,41,59,.9);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:40px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(10px)}
  .login-logo{font-size:32px;font-weight:800;color:var(--brand);letter-spacing:-1px;margin-bottom:4px}
  .login-sub{font-size:12px;color:var(--text3);margin-bottom:28px;letter-spacing:.5px;text-transform:uppercase}
  .login-input{width:100%;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;margin-bottom:10px;outline:none;transition:border .2s}
  .login-input:focus{border-color:var(--brand)}
  .login-btn{width:100%;padding:13px;background:var(--brand);border:none;border-radius:8px;color:#fff;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .2s}
  .login-btn:hover{opacity:.9}
  #loginErr{color:#f87171;font-size:12px;margin-top:8px;min-height:16px}
  .pass-wrap{position:relative;margin-bottom:10px}
  .pass-wrap input{width:100%;padding:12px 44px 12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:border .2s}
  .pass-wrap input:focus{border-color:var(--brand)}
  .pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px}

  /* APP */
  #app{display:none}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .topbar-logo{font-size:16px;font-weight:700;color:var(--brand)}
  .topbar-user{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:10px}
  .topbar-club{background:rgba(253,80,0,.15);color:var(--brand);padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
  .logout-btn{background:none;border:1px solid var(--border);padding:5px 12px;border-radius:6px;color:var(--text2);font-family:var(--font);font-size:11px;cursor:pointer}

  /* TABS */
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px}
  .tab{padding:14px 20px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand)}

  /* CONTENT */
  .content{padding:20px;max-width:800px;margin:0 auto}

  /* TRADING */
  .trading-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .trading-title{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
  .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi-box{background:var(--surface2);border-radius:8px;padding:14px;text-align:center}
  .kpi-val{font-size:24px;font-weight:700;font-family:monospace}
  .kpi-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .kpi-delta{font-size:11px;margin-top:2px}

  /* INCIDENCIAS */
  .inc-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:var(--brand);border:none;border-radius:8px;color:#fff;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:opacity .2s;width:100%;justify-content:center;margin-bottom:16px}
  .inc-btn:hover{opacity:.9}
  .inc-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;transition:border .2s}
  .inc-item:hover{border-color:var(--brand)}
  .inc-item-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .inc-badge{padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase}
  .badge-abierta{background:rgba(220,38,38,.2);color:#f87171}
  .badge-curso{background:rgba(245,158,11,.2);color:#fbbf24}
  .badge-resuelta{background:rgba(22,163,74,.2);color:#4ade80}
  .inc-item-title{font-size:13px;font-weight:600}
  .inc-item-meta{font-size:11px;color:var(--text3)}
  .empty-state{text-align:center;padding:40px;color:var(--text3);font-size:13px}

  /* MODAL */
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .modal.open{display:flex}
  .modal-box{background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:560px;margin-top:20px}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
  .close-btn{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer}
  .form-group{margin-bottom:14px}
  .form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:5px;display:block}
  .form-input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border .2s}
  .form-input:focus{border-color:var(--brand)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
  .btn-primary{padding:10px 20px;background:var(--brand);border:none;border-radius:8px;color:#fff;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer}
  .btn-secondary{padding:10px 20px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer}
  .btn-copy{padding:10px 20px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);border-radius:8px;color:#60a5fa;font-family:var(--font);font-size:13px;cursor:pointer}
  #formErr{color:#f87171;font-size:12px;margin-top:6px;min-height:14px}
  #copyMsg{color:var(--ok);font-size:11px;margin-top:6px;min-height:14px;text-align:right}

  /* FOTO */
  .foto-upload{border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:border .2s;margin-bottom:14px}
  .foto-upload:hover{border-color:var(--brand)}
  .foto-preview{max-width:100%;max-height:180px;border-radius:6px;margin-top:8px;object-fit:cover}
  
  .toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .toast.ok{background:#16a34a;color:#fff}
  .toast.warn{background:#f59e0b;color:#fff}
  .toast.ko{background:#dc2626;color:#fff}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">VivaGym</div>
    <div class="login-sub">Portal Staff · Sevilla</div>
    <input class="login-input" type="text" id="staffUser" placeholder="Usuario" autocomplete="username" onkeydown="if(event.key==='Enter')doStaffLogin()">
    <div class="pass-wrap">
      <input type="password" id="staffPass" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doStaffLogin()">
      <button class="pass-toggle" onclick="togglePass()" type="button" id="passToggle">👁</button>
    </div>
    <button class="login-btn" onclick="doStaffLogin()">Entrar</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">VivaGym</div>
    <div class="topbar-user">
      <span id="userLabel"></span>
      <span class="topbar-club" id="clubLabel"></span>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('incidencias',this)">🔧 Incidencias</div>
    <div class="tab" onclick="showTab('trading',this)">📈 Trading</div>
  </div>
  <div class="content">
    <div id="tabIncidencias">
      <button class="inc-btn" onclick="openNewInc()">➕ Nueva Incidencia</button>
      <div id="incList"></div>
    </div>
    <div id="tabTrading" style="display:none">
      <div id="tradingContent"></div>
    </div>
  </div>
</div>

<!-- MODAL INCIDENCIA -->
<div class="modal" id="incModal">
  <div class="modal-box">
    <div class="modal-title">
      <span id="modalTitle">Nueva Incidencia</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Categoría *</label>
        <select id="f_cat" class="form-input">
          <option value="Administrativa">Administrativa</option>
          <option value="Excedencia">Excedencia / Congelación</option>
          <option value="Instalación">Instalación</option>
          <option value="Socio">Socio</option>
          <option value="Objeto Perdido">Objeto Perdido</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Departamento SIGE *</label>
        <select id="f_depto" class="form-input">
          <option value="AT.CLIENTE">AT. Cliente</option>
          <option value="Facilities">Facilities</option>
          <option value="IT">IT</option>
          <option value="Marketing">Marketing</option>
          <option value="Branding">Branding</option>
          <option value="Compliance">Compliance</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Código Cliente</label>
        <input class="form-input" id="f_cod" type="text" placeholder="ej. 157p14016">
      </div>
      <div class="form-group">
        <label class="form-label">Nombre Cliente</label>
        <input class="form-input" id="f_nombre" type="text" placeholder="Nombre y apellidos">
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono</label>
        <input class="form-input" id="f_tel" type="tel" placeholder="600 000 000">
      </div>
      <div class="form-group">
        <label class="form-label">Prioridad</label>
        <select id="f_prio" class="form-input">
          <option value="Media/Baja">Media / Baja</option>
          <option value="Alta">Alta</option>
          <option value="Muy Alta">Muy Alta</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Descripción *</label>
      <textarea class="form-input" id="f_desc" rows="3" placeholder="Describe la incidencia..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Seguimiento / Notas</label>
      <textarea class="form-input" id="f_seg" rows="2" placeholder="Acciones tomadas, seguimiento..."></textarea>
    </div>
    <!-- FOTO -->
    <div class="foto-upload" onclick="document.getElementById('fotoInput').click()">
      <div id="fotoArea">📷 Toca para añadir foto (opcional)</div>
      <input type="file" id="fotoInput" accept="image/*" style="display:none" onchange="loadFoto(event)">
    </div>
    <div id="formErr"></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-copy" onclick="copyForSIGE()">📋 Copiar para SIGE</button>
      <button class="btn-primary" onclick="saveInc()">Guardar</button>
    </div>
    <div id="copyMsg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STAFF CREDENTIALS ──
const STAFF_USERS = {
  // Managers (can see all their club)
  'lremanager':  {pass:'lre2026',  club:'Los Remedios', name:'Manager LR'},
  'nervimanager':{pass:'ner2026',  club:'Nervión',      name:'Manager Nervión'},
  'cmsmanager':  {pass:'cms2026',  club:'Camas',        name:'Manager Camas'},
  // Staff (same as managers for now, can customize per person)
  'stafflre':    {pass:'stafflre26', club:'Los Remedios', name:'Staff LR'},
  'staffner':    {pass:'staffner26', club:'Nervión',      name:'Staff Nervión'},
  'staffcms':    {pass:'staffcms26', club:'Camas',        name:'Staff Camas'},
};

// ── TELEGRAM (same bot as dashboard) ──
const TG_TOKEN = '8964866056:AAFI8Ht0DDk0ooRZkJz0kjGkvf8JGlLsC50';
const TG_CHAT  = '7040500291';

let currentUser = null;
let INCS = [];
let editingId = null;
let fotoData = null;

// ── STORAGE KEY per club ──
const storageKey = () => `staff_incs_${currentUser?.club||'all'}`;

// ── AUTH ──
function doStaffLogin(){
  const u = document.getElementById('staffUser').value.trim().toLowerCase();
  const p = document.getElementById('staffPass').value.trim();
  const user = STAFF_USERS[u];
  if(!user||user.pass!==p){
    document.getElementById('loginErr').textContent='Usuario o contraseña incorrectos';
    return;
  }
  currentUser = {...user, username:u};
  localStorage.setItem('staff_session', JSON.stringify(currentUser));
  startApp();
}

function togglePass(){
  const inp = document.getElementById('staffPass');
  const btn = document.getElementById('passToggle');
  inp.type = inp.type==='password'?'text':'password';
  btn.textContent = inp.type==='password'?'👁':'🔒';
}

function doLogout(){
  localStorage.removeItem('staff_session');
  currentUser=null; INCS=[];
  document.getElementById('app').style.display='none';
  document.getElementById('loginOverlay').style.display='flex';
}

function startApp(){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userLabel').textContent = currentUser.name;
  document.getElementById('clubLabel').textContent = currentUser.club;
  loadIncs();
  renderIncs();
  renderTrading();
}

// ── PERSISTENCE ──
function loadIncs(){
  try{ INCS = JSON.parse(localStorage.getItem(storageKey())||'[]'); }
  catch(_){ INCS=[]; }
}
function saveIncs(){
  localStorage.setItem(storageKey(), JSON.stringify(INCS));
}
function genId(){ return 'INC-'+Date.now().toString(36).toUpperCase(); }

// ── TABS ──
function showTab(tab, btn){
  document.getElementById('tabIncidencias').style.display = tab==='incidencias'?'block':'none';
  document.getElementById('tabTrading').style.display = tab==='trading'?'block':'none';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

// ── TRADING DATA (demo - can be updated) ──
const TRADING_DEMO = {
  'Los Remedios': {bom:2593,joiners:32,leavers:55,budget_j:120,budget_l:100,arpu:32.5},
  'Nervión':      {bom:1820,joiners:18,leavers:30,budget_j:80, budget_l:70, arpu:29.8},
  'Camas':        {bom:2100,joiners:25,leavers:42,budget_j:95, budget_l:85, arpu:31.2},
};

function renderTrading(){
  const club = currentUser?.club;
  const t = TRADING_DEMO[club]||{};
  const net = (t.joiners||0)-(t.leavers||0);
  const eom = (t.bom||0)+(net);
  const churn = t.bom>0?(t.leavers/t.bom*100).toFixed(1)+'%':'—';

  document.getElementById('tradingContent').innerHTML = `
    <div class="trading-card">
      <div class="trading-title">📈 Trading MTD — ${club}</div>
      <div class="kpi-row">
        <div class="kpi-box">
          <div class="kpi-val" style="color:#fd5000">${t.bom||0}</div>
          <div class="kpi-lbl">Socios BOM</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" style="color:#16a34a">+${t.joiners||0}</div>
          <div class="kpi-lbl">Joiners MTD</div>
          <div class="kpi-delta" style="color:${(t.joiners||0)>=(t.budget_j||0)?'#16a34a':'#f87171'}">BDG: ${t.budget_j||0}</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" style="color:#dc2626">-${t.leavers||0}</div>
          <div class="kpi-lbl">Leavers MTD</div>
          <div class="kpi-delta" style="color:${(t.leavers||0)<=(t.budget_l||0)?'#16a34a':'#f87171'}">BDG: ${t.budget_l||0}</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" style="color:${net>=0?'#16a34a':'#dc2626'}">${net>=0?'+':''}${net}</div>
          <div class="kpi-lbl">Net Gain</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val">${eom}</div>
          <div class="kpi-lbl">EOM estimado</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-val" style="color:${parseFloat(churn)<10?'#16a34a':'#f87171'}">${churn}</div>
          <div class="kpi-lbl">Churn %</div>
        </div>
      </div>
    </div>
    <div class="trading-card">
      <div class="trading-title">💰 ARPU</div>
      <div class="kpi-row" style="grid-template-columns:1fr">
        <div class="kpi-box">
          <div class="kpi-val" style="color:#fd5000">€${t.arpu||0}</div>
          <div class="kpi-lbl">ARPU medio</div>
        </div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);text-align:center;padding:8px">
      Datos orientativos — actualiza el dashboard principal para cifras exactas
    </div>`;
}

// ── INCIDENCIAS ──
function renderIncs(){
  const list = document.getElementById('incList');
  if(!INCS.length){
    list.innerHTML='<div class="empty-state">Sin incidencias registradas.<br>Pulsa el botón para añadir la primera.</div>';
    return;
  }
  list.innerHTML = INCS.map(inc=>{
    const badgeCls = inc.estado==='Resuelta'?'badge-resuelta':inc.estado==='En curso'?'badge-curso':'badge-abierta';
    return `<div class="inc-item" onclick="openEditInc('${inc.id}')">
      <div class="inc-item-header">
        <span class="inc-badge ${badgeCls}">${inc.estado}</span>
        <span style="font-size:10px;color:var(--text3)">${inc.categoria}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--text3)">${inc.fecha}</span>
      </div>
      <div class="inc-item-title">${inc.descripcion?.slice(0,80)||'Sin descripción'}</div>
      <div class="inc-item-meta">${inc.depto}${inc.nombre?' · '+inc.nombre:''}${inc.prioridad==='Alta'?' · 🔴 Alta':''}</div>
      ${inc.foto?'<div style="font-size:10px;color:var(--brand);margin-top:4px">📷 Con foto</div>':''}
    </div>`;
  }).join('');
}

function openNewInc(){
  editingId=null; fotoData=null;
  document.getElementById('modalTitle').textContent='Nueva Incidencia';
  ['f_cat','f_depto','f_cod','f_nombre','f_tel','f_desc','f_seg','f_prio'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value = id==='f_prio'?'Media/Baja':'';
  });
  document.getElementById('fotoArea').innerHTML='📷 Toca para añadir foto (opcional)';
  document.getElementById('formErr').textContent='';
  document.getElementById('copyMsg').textContent='';
  document.getElementById('incModal').classList.add('open');
}

function openEditInc(id){
  const inc = INCS.find(i=>i.id===id);
  if(!inc) return;
  editingId=id; fotoData=inc.foto||null;
  document.getElementById('modalTitle').textContent='Editar Incidencia';
  document.getElementById('f_cat').value=inc.categoria||'';
  document.getElementById('f_depto').value=inc.depto||'';
  document.getElementById('f_cod').value=inc.codigo||'';
  document.getElementById('f_nombre').value=inc.nombre||'';
  document.getElementById('f_tel').value=inc.telefono||'';
  document.getElementById('f_desc').value=inc.descripcion||'';
  document.getElementById('f_seg').value=inc.seguimiento||'';
  document.getElementById('f_prio').value=inc.prioridad||'Media/Baja';
  document.getElementById('fotoArea').innerHTML = fotoData
    ? `<img src="${fotoData}" class="foto-preview"><div style="font-size:11px;color:var(--brand);margin-top:4px">Foto cargada · toca para cambiar</div>`
    : '📷 Toca para añadir foto (opcional)';
  document.getElementById('formErr').textContent='';
  document.getElementById('copyMsg').textContent='';
  document.getElementById('incModal').classList.add('open');
}

function closeModal(){
  document.getElementById('incModal').classList.remove('open');
}

function loadFoto(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    fotoData=e.target.result;
    document.getElementById('fotoArea').innerHTML=
      `<img src="${fotoData}" class="foto-preview"><div style="font-size:11px;color:var(--brand);margin-top:4px">Foto añadida · toca para cambiar</div>`;
  };
  reader.readAsDataURL(file);
}

function saveInc(){
  const desc=document.getElementById('f_desc').value.trim();
  if(!desc){document.getElementById('formErr').textContent='La descripción es obligatoria';return;}
  const now=new Date().toLocaleDateString('es-ES');
  const inc={
    id:editingId||genId(),
    club:currentUser.club,
    staff:currentUser.name,
    categoria:document.getElementById('f_cat').value,
    depto:document.getElementById('f_depto').value,
    codigo:document.getElementById('f_cod').value.trim(),
    nombre:document.getElementById('f_nombre').value.trim(),
    telefono:document.getElementById('f_tel').value.trim(),
    descripcion:desc,
    seguimiento:document.getElementById('f_seg').value.trim(),
    prioridad:document.getElementById('f_prio').value,
    estado:'Abierta',
    foto:fotoData||null,
    fecha:now,
    created_at:editingId?(INCS.find(i=>i.id===editingId)?.created_at||now):now,
  };
  if(editingId){
    const idx=INCS.findIndex(i=>i.id===editingId);
    if(idx>=0) INCS[idx]={...INCS[idx],...inc,estado:INCS[idx].estado};
  } else {
    INCS.unshift(inc);
    // Send Telegram notification
    tgNotify(inc);
  }
  saveIncs();
  closeModal();
  renderIncs();
  showToast('Incidencia guardada','ok');
}

function copyForSIGE(){
  const now=new Date().toLocaleString('es-ES');
  const text=[
    '═══════════════════════════════════',
    '📋 INCIDENCIA PARA SIGE',
    '═══════════════════════════════════',
    `Club:           ${currentUser?.club||'—'}`,
    `Departamento:   ${document.getElementById('f_depto').value||'—'}`,
    `Categoría:      ${document.getElementById('f_cat').value||'—'}`,
    `Prioridad:      ${document.getElementById('f_prio').value||'—'}`,
    '───────────────────────────────────',
    `Código cliente: ${document.getElementById('f_cod').value||'—'}`,
    `Nombre cliente: ${document.getElementById('f_nombre').value||'—'}`,
    `Teléfono:       ${document.getElementById('f_tel').value||'—'}`,
    '───────────────────────────────────',
    'Descripción:',
    document.getElementById('f_desc').value||'—',
    '───────────────────────────────────',
    'Seguimiento:',
    document.getElementById('f_seg').value||'—',
    '───────────────────────────────────',
    `Registrado por: ${currentUser?.name||'—'}`,
    `Fecha:          ${now}`,
    '═══════════════════════════════════',
  ].join('\n');

  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('copyMsg').textContent='✓ Copiado — pégalo directamente en SIGE';
    showToast('Copiado para SIGE','ok');
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    document.getElementById('copyMsg').textContent='✓ Copiado';
  });
}

// ── TELEGRAM ──
async function tgNotify(inc){
  try{
    const text=`🔧 *Nueva Incidencia — ${inc.club}*\n`+
      `Categoría: ${inc.categoria} · ${inc.depto}\n`+
      `Prioridad: ${inc.prioridad}\n`+
      `${inc.nombre?'Cliente: '+inc.nombre+'\n':''}`+
      `Descripción: ${inc.descripcion?.slice(0,100)}\n`+
      `Registrado por: ${inc.staff}`;
    await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG_CHAT,text,parse_mode:'Markdown'})
    });
  }catch(_){}
}

// ── TOAST ──
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ── INIT ──
(function(){
  const sess=localStorage.getItem('staff_session');
  if(sess){
    try{currentUser=JSON.parse(sess);startApp();}catch(_){}
  }
})();
</script>
